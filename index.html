<!DOCTYPE html>

<aside class="sidebar" id="sidebar" aria-label="Navegación"></aside>
<main class="main" id="main">
  <div class="page active" id="page"><p class="v2-loading">Cargando…</p></div>
</main>
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
<div class="drawer-panel" id="drawerPanel">
<div class="drawer-header">
<div>
<div class="drawer-title">Editar perfil</div>
<div class="drawer-subtitle">Juan Pérez · +54 9 11 1234-5678</div>
</div>
<button class="drawer-close-btn" onclick="closeDrawer()">
<svg fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewbox="0 0 14 14" width="14">
<line x1="2" x2="12" y1="2" y2="12"></line><line x1="12" x2="2" y1="2" y2="12"></line>
</svg>
</button>
</div>
<div class="drawer-content">
<div style="display:flex;flex-direction:column;gap:1.25rem">
<div><p style="font-size:.625rem;font-weight:600;color:var(--n300);margin-bottom:.375rem;text-transform:uppercase;letter-spacing:.06em">Nombre</p>
<input class="inp" style="width:100%" type="text" value="Juan Pérez"/></div>
<div><p style="font-size:.625rem;font-weight:600;color:var(--n300);margin-bottom:.375rem;text-transform:uppercase;letter-spacing:.06em">Teléfono</p>
<input class="inp" style="width:100%;font-family:var(--font-display)" type="text" value="+54 9 11 1234-5678"/></div>
<div><p style="font-size:.625rem;font-weight:600;color:var(--n300);margin-bottom:.375rem;text-transform:uppercase;letter-spacing:.06em">Email</p>
<input class="inp" style="width:100%" type="email" value="juan@empresa.com"/></div>
<div><p style="font-size:.625rem;font-weight:600;color:var(--n300);margin-bottom:.375rem;text-transform:uppercase;letter-spacing:.06em">Estado</p>
<span class="badge badge-success" style="width:fit-content"><span class="badge-dot"></span>Suscripto</span></div>
</div>
</div>
<div class="drawer-footer">
<button class="btn btn-secondary" onclick="closeDrawer()">Cancelar</button>
<button class="btn btn-primary">Guardar cambios</button>
</div>
</div>
<script src="assets/js/legacy.js"></script>
<script src="assets/js/app.js"></script>
